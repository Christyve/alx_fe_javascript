<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
  <!-- Tailwind CSS for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Custom styles for the Inter font and overall body layout */
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f0f4f8; /* Light gray-blue background */
      color: #333; /* Dark text color */
      padding: 20px;
    }
  </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-xl shadow-lg max-w-2xl w-full">
    <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">Dynamic Quote Generator</h1>

    <!-- Container for displaying the quote -->
    <div id="quoteDisplay" class="bg-blue-50 p-6 rounded-lg mb-8 text-center border-l-4 border-blue-400">
      <p id="quoteText" class="text-2xl font-semibold italic text-gray-700 mb-2">
        <!-- Quote text will be loaded here -->
      </p>
      <p id="quoteCategory" class="text-lg font-medium text-blue-600">
        <!-- Quote category will be loaded here -->
      </p>
    </div>

    <!-- Button to show a new random quote -->
    <button id="newQuote" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 mb-8">
      Show New Quote
    </button>

    <!-- Section for adding new quotes -->
    <div class="border-t-2 border-gray-200 pt-8 mt-8">
      <h2 class="text-2xl font-semibold text-center mb-6 text-gray-700">Add New Quote</h2>
      <div class="flex flex-col md:flex-row gap-4 mb-4">
        <!-- Input field for new quote text -->
        <input id="newQuoteText" type="text" placeholder="Enter a new quote" class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <!-- Input field for new quote category -->
        <input id="newQuoteCategory" type="text" placeholder="Enter quote category" class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <!-- Button to add the new quote -->
      <button onclick="addQuote()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105">
        Add Quote
      </button>
    </div>
  </div>
  <!-- Link to the JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
