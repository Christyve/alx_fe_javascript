<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Quote Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f9f9f9;
    }
    #quoteDisplay {
      font-size: 1.5em;
      margin: 20px 0;
      padding: 10px;
      background: #fff;
      border-left: 4px solid #007acc;
    }
    select, input, button {
      margin: 5px 0;
      padding: 10px;
      font-size: 1em;
    }
    .input-section {
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <label for="categoryFilter">Filter by Category:</label>
  <select id="categoryFilter" onchange="filterQuotes()"></select>

  <div id="quoteDisplay">Loading quote...</div>

  <div class="input-section">
    <h2>Add a New Quote</h2>
    <input type="text" id="newQuoteText" placeholder="Enter quote text" size="40"/>
    <input type="text" id="newQuoteCategory" placeholder="Enter category" size="20"/>
    <button onclick="addQuote()">Add Quote</button>
  </div>

  <div class="input-section">
    <h2>Import/Export</h2>
    <input type="file" accept=".json" onchange="importFromJsonFile(event)"/>
    <button onclick="exportToJsonFile()">Export Quotes</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
