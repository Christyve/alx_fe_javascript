<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Quote Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    #quoteDisplay {
      font-size: 1.3rem;
      margin: 20px 0;
      padding: 20px;
      background: #fff;
      border-left: 5px solid #4caf50;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    select, input[type="text"], button {
      padding: 10px;
      font-size: 1rem;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .section {
      background: #ffffff;
      padding: 15px;
      margin-top: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
    }
    input[type="file"] {
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <h1>Dynamic Quote Generator</h1>

  <!-- Category Filter -->
  <div class="section">
    <label for="categoryFilter">Filter by Category:</label>
    <select id="categoryFilter" onchange="filterQuotes()">
      <!-- Dynamically populated options -->
    </select>
  </div>

  <!-- Quote Display -->
  <div id="quoteDisplay">Loading quote...</div>

  <!-- Add Quote Form -->
  <div class="section">
    <h2>Add a New Quote</h2>
    <div class="form-group">
      <label for="newQuoteText">Quote:</label>
      <input type="text" id="newQuoteText" placeholder="Enter quote text" />
    </div>
    <div class="form-group">
      <label for="newQuoteCategory">Category:</label>
      <input type="text" id="newQuoteCategory" placeholder="Enter category" />
    </div>
    <button onclick="addQuote()">Add Quote</button>
  </div>

  <!-- Export & Import -->
  <div class="section">
    <h2>Export / Import Quotes</h2>
    <button onclick="exportToJsonFile()">Export to JSON</button>
    <input type="file" accept=".json" onchange="importFromJsonFile(event)" />
  </div>

  <script src="script.js"></script>
</body>
</html>
